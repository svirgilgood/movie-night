<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link href="{{ url_for('static', path='/style.css') }}" rel="stylesheet">
    <style>
      img {
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 5px;
        width: 150px;
      }
      /* The Modal (background) */
      .modal {
        display: none; /* Hidden by default */
        position: fixed; /* Stay in place */
        z-index: 1; /* Sit on top */
        left: 0;
        top: 0;
        width: 100%; /* Full width */
        height: 100%; /* Full height */
        overflow: auto; /* Enable scroll if needed */
        background-color: rgb(0,0,0); /* Fallback color */
        background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
      }
      .modal-content {
        display: grid;
        /* Work on grid style */
        grid-template-areas:
          "thumbnail"
          "column";
        position: relative;
        background-color: #fefefe;
        margin: 15% auto; /* 15% from the top and centered */
        padding: 0px;
        border: 1px solid #888;
        width: 80%; /* Could be more or less, depending on screen size */
      }
      /* The Close Button */
      .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
      }

      .close:hover,
      .close:focus {
        color: black;
        text-decoration: none;
        cursor: pointer;
      }
      .movie-choice {
        position: relative
      }
    </style>
  </head>
  <body>

    <h1 class="center">Home</h1>
    <div style="justify-content:center;align-items:center;display:grid; padding:10px;">
      {% for row in members %}
      <div class="member-box"  style="border:1px solid grey;padding:10px;border-radius:5%;">
        <div class="member-name" id="{{ row['mid'] }}" onclick="myhref(id)" >
          <p>{{ row["name"] }}</p>
          <p>{{ row["date"] }}</p>
        </div>
        <div class="member-box">
          <div class="box-content" memberid="{{ row['member'] }}" style="z-index:-1;"  >
            <!--  Last Movie Chosen (image?), date, new movie choice  -->
              <input aria-label="Movie IMDB Identity" list="{{ row['member'] + 'movie-id' + 'list'}}" onkeyup="autoComplete(id)" type="text" name="movie" id="{{ row['member'] + 'movie-id'}}" size=30 />
              <input aria-label="Chose date type" type="date" name="date" id="{{row['member'] + 'date-input-id'}}" size=30 />
              <button name="{{ row['member']}}" onclick="addMovieChoice(name)">Submit</button>
          </div>
          <div class="modal" id="{{ row['member'] + '-modal'}}">
            <div class="modal-content" id="{{ row['member'] + '-modal-content' }}">
              {% for choice in row["movies"] %}
                <div class="movie-choice">
                  <span class="movie-title">{{ choice["movie_title"] }} </span>
                  <span class="choice-date">{{ choice["date"] }} </span>
                </div>
              {% endfor %}
            </div>
          </div>
        </div>
      </div>
      {% endfor %}

      <button type="button" id="add-member-button" onclick="toggleActive(this.nextElementSibling)" class="collapsible">Add Member</button>
      <div class="content" id="add-id-input">
        <input aria-label="Name"  type="text" name="name" id="name-entry" size=30 />
        <button onclick="addFamilyMember()">Submit</button>
      </div>
    </div>

  </body>
  <script>
  function myhref(mid) { window.location.href = `/movies/${mid}`; }
    function createMovieModal(memberid) {
      console.log(memberid);
      const member = memberid.endsWith("-modal") ? memberid.replace("-modal", "") : memberid;
      const movieModal = document.getElementById(member + "-modal");
      //console.log("memberid", memberid);
      const modalContent = document.getElementById(member + "-modal-content");
      // Add Header to modal with Users name
      fetch("/movie-choices", {
        method: "POST",
        headers: { "Content-Type": "application/json"},
        body: JSON.stringify({"member": member}),
      }).then(response => response.json())
        .then(r => {
          for (const choice of r) {
            const choiceDiv = document.createElement("div");
            choiceDiv.setAttribute("class", "movie-choice");
            const thumbnail = document.createElement("img");
            thumbnail.setAttribute("src", choice.posterUrl);
            thumbnail.setAttribute("alt", choice.movieTitle);
            thumbnail.setAttribute("class", "thumbnail");
            choiceDiv.appendChild(thumbnail);
            const titleEle = document.createElement("span");
            titleEle.innerHTML = choice.movieTitle;
            titleEle.setAttribute("class", "movie-title-modal");
            choiceDiv.appendChild(titleEle);
            const dateEle  = document.createElement("span");
            dateEle.innerHTML = choice.date;
            dateEle.setAttribute("class", "choice-date-modal");
            choiceDiv.appendChild(dateEle);
            modalContent.appendChild(choiceDiv);
          }
          movieModal.style.display = "block";
          window.onclick = function(event) {
            if (event.target === movieModal) {
              movieModal.display = "none";
            }
          }
        })
    }
    function addMovieChoice(name) {
      const movieImdbId = document.getElementById(name + "movie-id");
      const movieChoices = document.getElementById(name + "movie-idlist");
      const dateChoice = document.getElementById(name + "date-input-id");
      const movieChoice = movieChoices.options.namedItem(movieImdbId.value)
      const movieId = movieChoice.getAttribute('data-id');
      const posterId = movieChoice.getAttribute("poster-id");
      console.log(name, dateChoice, movieImdbId, movieId, posterId);
      fetch("/update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({"function": "add_movie", data: {"member": name, "movie-name": movieImdbId.value, "poster-id": posterId, "movie-id": movieId, "date": dateChoice.value }})

      }).then(()=> {
        movieImdbId.value = "";
        dateChoice.value = "";
        window.location.reload();

      })
    }
    function autoComplete(id) {
      const titleEle = document.getElementById(id);
      const title = titleEle.value
      fetch("/mdb", {
        method: "POST",
        headers: { "Content-Type": "application/json"},
        body: JSON.stringify({title})
      }).then(response => response.json())
        .then(r => {
          if (r.Response === "True") {
            titleEle.innerHTML = "";
            const acList = document.createElement("datalist");
            acList.setAttribute("id", id + "list");
            //acList.setAttribute("class", "autocomplete-items");
            console.log(r.Search);
            for ( const movie of r.Search ) {
              const movieOption = document.createElement("option");
              movieOption.setAttribute("data-id", movie.imdbID);
              movieOption.setAttribute("poster-id", movie.Poster);
              movieOption.id = `${movie.Title} - ${movie.Year}`;
              movieOption.value = `${movie.Title} - ${movie.Year}`;
              acList.appendChild(movieOption);
            }
            titleEle.appendChild(acList);
          }
        })
    }
    function toggleActive(content) {
      /*this.toggle("active");*/
      console.log(content);
      if (content.style.display === "block") {
        content.style.display = "none";
      } else {
        content.style.display = "block";
      }
    }
    function addFamilyMember() {
      let name = document.getElementById("name-entry").value;
      console.log(name);
      fetch("/update", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({"function": "add_family_member", data: { name } })
      }).then(response => response.json())
        .then(data => {
          let nameField = document.getElementById("name-entry");
          nameField.value = "";
          window.location.reload();
        })
    }

  </script>
</html>
